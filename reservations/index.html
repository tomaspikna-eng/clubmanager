<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rezervácie — CSP Club Manager</title><link rel="stylesheet" href="../assets/styles.css"><style>
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.wide{grid-column:1/-1}.reservation{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.reservation-head{display:flex;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:760px){.sidebar{display:none}.main{margin-left:0!important}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">C</div><div><div class="brand-name"><span>Connect</span>Sports<span>Pro</span></div><div class="brand-sub">Club Manager</div></div></div><a class="nav-link" href="../dashboard/">📊 Dashboard</a><a class="nav-link active" href="../reservations/">📅 Rezervácie</a><a class="nav-link" href="../venues/">🎱 Športoviská</a></aside>
<main class="main"><header class="topbar"><div><strong id="clubName">Club Manager</strong> · Rezervácie</div><button class="ghost" id="logout">Odhlásiť</button></header><section class="content"><div class="page-head"><h1>Rezervácie</h1><p>Front rezervácií je priamo napojený na live prevádzku.</p></div><div id="notice"></div>
<section class="panel"><h3>Nová rezervácia</h3><div class="form-grid"><label>Stanica<select id="station"></select></label><label>Meno<input id="name"></label><label>Telefón<input id="phone"></label><label>E-mail<input id="email" type="email"></label><label>Počet osôb<input id="party" type="number" min="1" value="2"></label><label>Stav<select id="status"><option value="confirmed">Potvrdená</option><option value="pending">Čaká na potvrdenie</option></select></label><label>Začiatok<input id="starts" type="datetime-local"></label><label>Koniec<input id="ends" type="datetime-local"></label><label class="wide">Interná poznámka<textarea id="note" rows="2"></textarea></label></div><div class="actions"><button class="primary" id="save">Uložiť rezerváciu</button><button class="ghost" id="clear">Vyčistiť</button></div></section>
<section class="panel"><h3>Najbližšie rezervácie</h3><div id="list">Načítavam…</div></section></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/config.js"></script><script src="../assets/app.js"></script><script>
const A=CSPClubManager,$=id=>document.getElementById(id);let ctx,stations=[],reservations=[],editing=null,channel;logout.onclick=A.logout;
function msg(t,e=false){notice.innerHTML=t?`<div class="notice">${A.esc(t)}</div>`:''}
function localIso(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)}
function reset(){editing=null;name.value=phone.value=email.value=note.value='';party.value=2;status.value='confirmed';const s=new Date(Date.now()+3600000);s.setMinutes(Math.ceil(s.getMinutes()/30)*30,0,0);starts.value=localIso(s);ends.value=localIso(new Date(s.getTime()+3600000))}
async function load(){ctx=await A.requireAccess();clubName.textContent=ctx.club?.name||'Klub';const [st,rs]=await Promise.all([A.db.from('stations').select('*').eq('club_id',ctx.club.id).eq('is_active',true).order('sort_order'),A.db.from('reservations').select('*').eq('club_id',ctx.club.id).gte('ends_at',new Date(Date.now()-86400000).toISOString()).not('status','eq','cancelled').order('starts_at')]);if(st.error||rs.error)throw st.error||rs.error;stations=st.data||[];reservations=rs.data||[];station.innerHTML=stations.map(s=>`<option value="${s.id}">${A.esc(s.name)}</option>`).join('');render();if(!channel)channel=A.subscribe(ctx.club.id,()=>load())}
function render(){list.innerHTML=reservations.map(r=>{const st=stations.find(s=>s.id===r.station_id);return `<article class="reservation"><div class="reservation-head"><div><b>${A.esc(r.customer_name)}</b><div>${new Date(r.starts_at).toLocaleString('sk-SK')} – ${new Date(r.ends_at).toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})}</div><small>${A.esc(st?.name||r.station_name_snapshot||'Bez stanice')} · ${A.esc(r.status)}</small></div></div><div class="actions"><button data-a="edit" data-id="${r.id}">Upraviť</button><button data-a="confirm" data-id="${r.id}">Potvrdiť</button><button data-a="start" data-id="${r.id}">Check-in a štart</button><button data-a="cancel" data-id="${r.id}">Zrušiť</button></div></article>`}).join('')||'<div class="empty">Žiadne rezervácie.</div>'}
save.onclick=async()=>{save.disabled=true;try{const {error}=await A.db.rpc('club_manager_upsert_reservation',{p_reservation_id:editing,p_club_id:ctx.club.id,p_station_id:station.value,p_customer_name:name.value,p_customer_email:email.value,p_customer_phone:phone.value,p_party_size:Number(party.value||1),p_starts_at:new Date(starts.value).toISOString(),p_ends_at:new Date(ends.value).toISOString(),p_internal_note:note.value,p_status:status.value});if(error)throw error;reset();await load();msg('Rezervácia uložená.')}catch(e){msg(e.message,true)}finally{save.disabled=false}}
clear.onclick=reset;
list.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=reservations.find(x=>x.id===b.dataset.id);if(!r)return;try{if(b.dataset.a==='edit'){editing=r.id;station.value=r.station_id;name.value=r.customer_name;phone.value=r.customer_phone||'';email.value=r.customer_email||'';party.value=r.party_size||1;starts.value=localIso(r.starts_at);ends.value=localIso(r.ends_at);note.value=r.internal_note||'';status.value=r.status==='pending'?'pending':'confirmed';scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.a==='start'){const {error}=await A.db.rpc('club_manager_start_reservation',{p_reservation_id:r.id,p_price_profile_code:'walkin'});if(error)throw error;location.href='../dashboard/';return}const target=b.dataset.a==='confirm'?'confirmed':'cancelled';const {error}=await A.db.rpc('club_manager_set_reservation_status',{p_reservation_id:r.id,p_status:target});if(error)throw error;await load()}catch(e){msg(e.message,true)}}
reset();load().catch(e=>msg(e.message,true));
</script></body></html>
